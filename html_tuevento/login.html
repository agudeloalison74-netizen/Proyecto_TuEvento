<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar Sesión | TuEvento</title>

    <link rel="stylesheet" href="../../css/estilos.css">
    <link rel="icon" type="image/png" href="../../img/logo.png">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <h1>TUEVENTO</h1>
            <h2>Iniciar Sesión</h2>

            <form>

                <div class="input-group">

                    <label for="correo">
                        Correo Electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        placeholder="ejemplo@gmail.com"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="contrasena">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="contrasena"
                        placeholder="********"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="tipoUsuario">
                        Tipo de Usuario
                    </label>

                    <select id="tipoUsuario" required>

                        <option value="">
                            Seleccione una opción
                        </option>

                        <option value="cliente">
                            Cliente
                        </option>

                        <option value="empresa">
                            Empresa
                        </option>

                        <option value="administrador">
                            Administrador
                        </option>

                    </select>

                </div>


                <button type="submit" class="btn-login">
                    Ingresar
                </button>

            </form>


            <div class="links">

                <a href="recuperar_contrasena.html">
                    ¿Olvidaste tu contraseña?
                </a>

                <a href="index.html">
                    Volver al inicio
                </a>

            </div>

        </div>

    </div>


    <footer>

        <div class="footer-contenido">

            <h3>TuEvento</h3>

            <p>
                Plataforma para la gestión y organización de eventos.
            </p>

            <p>
                © 2026 TuEvento.
            </p>

            <p>
                Desarrollado por Alison Agudelo y Dayana Bejarano
            </p>

        </div>

    </footer>


    <!-- JavaScript del inicio de sesión -->

    <script src="../js/login.js"></script>

</body>

</html>
